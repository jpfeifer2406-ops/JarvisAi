[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "computer-prototype-openai"
version = "0.0.1"
description = "Experimental COMPUTER-owned core with an interchangeable OpenAI Agents adapter"
requires-python = ">=3.11,<3.14"
dependencies = ["openai-agents==0.22.3", "fastapi==0.141.1", "uvicorn==0.53.0", "pydantic==2.13.5", "httpx==0.28.1", "aiohttp>=3.13,<4", "python-docx>=1.1,<2", "reportlab>=4.2,<5", "pypdf>=5,<7", "defusedxml==0.7.1"]
[project.optional-dependencies]
transport = ["pipecat-ai[livekit]==1.11.0", "livekit-api==1.2.1"]
voice = ["sounddevice>=0.5,<1", "faster-whisper>=1.1,<2", "openwakeword==0.6.0"]
qwen = ["qwen-tts==0.1.1"]
drive = ["google-auth-oauthlib>=1.2,<2", "google-api-python-client>=2.150,<3", "keyring>=25,<26"]
test = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.8"]
[project.scripts]
computer = "computer.__main__:main"
[tool.setuptools.package-data]
computer = ["static/*", "profiles/*.json"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

name: COMPUTER feature checks

on:
  push:
    branches:
      - feature-news-globe
      - feature-v0.5.2-voice-first
      - feature-v0.6.0
  pull_request:
    branches:
      - computer-test

jobs:
  news-mode-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install feature test dependencies
        run: python -m pip install pytest ddgs pyyaml numpy sounddevice python-docx reportlab pypdf
      - name: Compile changed Python modules
        run: python -m py_compile jarvis/config_runtime.py jarvis/permissions.py jarvis/news.py jarvis/main.py jarvis/web.py jarvis/tts.py jarvis/ui_commands.py jarvis/wake.py jarvis/integrations.py jarvis/workshop.py jarvis/tools/router.py
      - name: Check inline cockpit JavaScript syntax
        shell: pwsh
        run: |
          @'
          import pathlib, re
          html = pathlib.Path("jarvis/static/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S)
          pathlib.Path("inline-cockpit.js").write_text("\n".join(blocks), encoding="utf-8")
          '@ | python -
          node --check inline-cockpit.js
      - name: Run feature tests
        run: python -m pytest -q tests/test_news.py tests/test_ui_commands.py tests/test_workshop.py tests/test_tts.py tests/test_runtime_config.py tests/test_permissions.py

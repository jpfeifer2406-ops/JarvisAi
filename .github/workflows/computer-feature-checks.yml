name: COMPUTER feature checks

on:
  push:
    branches:
      - feature-news-globe
  pull_request:
    branches:
      - computer-test

jobs:
  news-mode-checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight test dependencies
        run: python -m pip install pytest ddgs
      - name: Compile changed Python modules
        run: python -m py_compile jarvis/news.py jarvis/main.py jarvis/web.py
      - name: Run news-mode tests
        run: python -m pytest -q tests/test_news.py

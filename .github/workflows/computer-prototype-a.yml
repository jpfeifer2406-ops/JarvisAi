name: COMPUTER Prototype A
on:
  push:
    branches: [prototype-computer-openai]
    paths: ['prototypes/openai/**', '.github/workflows/computer-prototype-a.yml']
  pull_request:
    paths: ['prototypes/openai/**', '.github/workflows/computer-prototype-a.yml']
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: prototypes/openai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[test,transport]"
      - run: python -m ruff check computer tests
      - run: python -m pytest -q
      - run: node --check computer/static/app.js
      - run: node --check computer/static/voice-client.js
      - run: node --check browser_extension/popup.js
